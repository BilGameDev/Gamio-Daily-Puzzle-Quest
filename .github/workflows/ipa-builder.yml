name: iOS Build with CocoaPods

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          clean: true

      # ========================================
      # FIX 1: Improved Library Cache (only changes when Unity version changes)
      # ========================================
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json') }}
          restore-keys: |
            Library-iOS-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-
            Library-iOS-

      # ========================================
      # FIX 2: Cache Unity's Incremental Build Data (IL2CPP)
      # This prevents recompiling unchanged C++ code
      # ========================================
      - name: Cache Unity Incremental Build (IL2CPP/Burst)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/unity3d/bee
            ~/Library/Caches/unity3d/bee
          key: bee-cache-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            bee-cache-${{ runner.os }}-

      # ========================================
      # FIX 3: Cache CocoaPods
      # ========================================
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods/repos
            ~/.cocoapods/pods
            Pods
          key: cocoapods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            cocoapods-

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Build Xcode Project with Unity
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: iOS
          buildName: UnityGame
          allowDirtyBuild: true
          cache: true  # ← THIS IS CRITICAL
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

      - name: Run Pod Install
        run: |
          cd build/ios
          if [ -f "Podfile" ]; then
            pod install --repo-update
          fi

      - name: Build Unsigned IPA
        run: |
          # First, find where the Xcode project was actually created
          echo "Searching for Xcode project..."
          XCODE_PATH=$(find . -name "Unity-iPhone.xcodeproj" -type d 2>/dev/null | head -1)

          if [ -z "$XCODE_PATH" ]; then
            echo "❌ Could not find Unity-iPhone.xcodeproj"
            echo "Listing directories for debugging:"
            ls -la
            ls -la build/ || true
            ls -la build/ios/ || true
            exit 1
          fi

          echo "✅ Found Xcode project at: $XCODE_PATH"
          cd $(dirname "$XCODE_PATH")

          BUILD_CONFIG="${{ inputs.build_configuration || 'Release' }}"
          echo "Building with configuration: $BUILD_CONFIG"

          # Determine if we use workspace or project
          if [ -d "Unity-iPhone.xcworkspace" ]; then
            echo "Using workspace (CocoaPods detected)"
            xcodebuild -workspace Unity-iPhone.xcworkspace \
                       -scheme "Unity-iPhone" \
                       -configuration "$BUILD_CONFIG" \
                       -sdk iphoneos \
                       -archivePath "./build/Unity-iPhone.xcarchive" \
                       archive \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO
          else
            echo "Using project (no CocoaPods)"
            xcodebuild -project "Unity-iPhone.xcodeproj" \
                       -scheme "Unity-iPhone" \
                       -configuration "$BUILD_CONFIG" \
                       -sdk iphoneos \
                       -archivePath "./build/Unity-iPhone.xcarchive" \
                       archive \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO
          fi

          # ========================================
          # FIND THE ACTUAL .app NAME AND LOCATION
          # ========================================
          echo "Searching for .app file..."

          # Try multiple possible locations for the .app
          APP_PATH=$(find ./build -name "*.app" -type d 2>/dev/null | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ Could not find .app file"
            echo "Searching in archive directory:"
            find ./build -name "*.app" -type d 2>/dev/null || echo "No .app found"
            exit 1
          fi

          echo "✅ Found .app at: $APP_PATH"
          APP_NAME=$(basename "$APP_PATH")
          echo "App name is: $APP_NAME"

          # Create Payload folder and copy the .app
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/

          # Create IPA
          IPA_NAME="Gamio_$(date +%Y%m%d_%H%M%S).ipa"
          zip -r "$IPA_NAME" Payload

          mkdir -p ${{ github.workspace }}/output
          mv "$IPA_NAME" ${{ github.workspace }}/output/

          echo "✅ IPA created: $IPA_NAME"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity-iOS-Build
          path: ${{ github.workspace }}/output/*.ipa
          retention-days: 30
