name: iOS Build with CocoaPods

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          clean: true

      # ========================================
      # FIX 1: Improved Library Cache (only changes when Unity version changes)
      # ========================================
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json') }}
          restore-keys: |
            Library-iOS-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-
            Library-iOS-

      # ========================================
      # FIX 2: Cache Unity's Incremental Build Data (IL2CPP)
      # This prevents recompiling unchanged C++ code
      # ========================================
      - name: Cache Unity Incremental Build (IL2CPP/Burst)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/unity3d/bee
            ~/Library/Caches/unity3d/bee
          key: bee-cache-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            bee-cache-${{ runner.os }}-

      # ========================================
      # FIX 3: Cache CocoaPods
      # ========================================
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods/repos
            ~/.cocoapods/pods
            Pods
          key: cocoapods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            cocoapods-

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Build Xcode Project with Unity
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: iOS
          buildName: UnityGame
          allowDirtyBuild: true
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

      - name: Run Pod Install
        run: |
          cd build/ios
          if [ -f "Podfile" ]; then
            pod install --repo-update
          fi

      - name: Build Unsigned IPA
        run: |
          cd build/ios
          BUILD_CONFIG="${{ inputs.build_configuration || 'Release' }}"
          
          if [ -d "Unity-iPhone.xcworkspace" ]; then
            xcodebuild -workspace Unity-iPhone.xcworkspace \
                       -scheme "Unity-iPhone" \
                       -configuration "$BUILD_CONFIG" \
                       -sdk iphoneos \
                       -archivePath "./build/Unity-iPhone.xcarchive" \
                       archive \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO
          else
            xcodebuild -project Unity-iPhone.xcodeproj \
                       -scheme "Unity-iPhone" \
                       -configuration "$BUILD_CONFIG" \
                       -sdk iphoneos \
                       -archivePath "./build/Unity-iPhone.xcarchive" \
                       archive \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO
          fi
          
          mkdir -p Payload
          cp -r "./build/Unity-iPhone.xcarchive/Products/Applications/Unity-iPhone.app" Payload/
          APP_NAME="UnityGame_$(date +%Y%m%d_%H%M%S).ipa"
          zip -r "$APP_NAME" Payload
          mkdir -p ${{ github.workspace }}/output
          mv "$APP_NAME" ${{ github.workspace }}/output/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity-iOS-Build
          path: ${{ github.workspace }}/output/*.ipa
          retention-days: 30
