name: iOS Build

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: "Build version (leave empty for auto)"
        required: false
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest

    env:
      UNITY_VERSION: 6000.3.9f1
      BUILD_PATH: Build/iOS
      ARCHIVE_PATH: Build/Gamio.xcarchive
      IPA_OUTPUT: Build/IPA

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-
            Library-

      - name: Install CocoaPods
        run: gem install cocoapods -q

      - name: Setup Unity
        uses: game-ci/unity-setup@v2
        with:
          unity-version: ${{ env.UNITY_VERSION }}
          components: ios

      - name: Activate Unity License
        uses: game-ci/unity-activate@v2
        with:
          unity-username: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}

      - name: Build iOS Xcode Project with Unity
        run: |
          /Applications/Unity/Hub/Editor/${{ env.UNITY_VERSION }}/Unity.app/Contents/MacOS/Unity \
            -quit -batchmode -nographics \
            -projectPath "${{ github.workspace }}" \
            -executeMethod Gamio.Build.iOSBuilder.iOS \
            -logFile "${{ github.workspace }}/unity_build.log" \
            -buildTarget iOS
          UNITY_EXIT=$?
          if [ $UNITY_EXIT -ne 0 ]; then
            echo "=== Unity build log ==="
            cat "${{ github.workspace }}/unity_build.log"
            exit $UNITY_EXIT
          fi

      - name: Install CocoaPods Dependencies
        run: |
          cd "${{ github.workspace }}/${{ env.BUILD_PATH }}"
          pod install --repo-update

      - name: Archive Xcode Project (unsigned)
        run: |
          cd "${{ github.workspace }}/${{ env.BUILD_PATH }}"
          xcodebuild -workspace Unity-iPhone.xcworkspace \
            -scheme Unity-iPhone \
            -configuration Release \
            -archivePath "${{ github.workspace }}/${{ env.ARCHIVE_PATH }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Export IPA (unsigned)
        run: |
          mkdir -p "${{ github.workspace }}/${{ env.IPA_OUTPUT }}"

          python3 -c "
import plistlib
p = {
  'method': 'development',
  'signingStyle': 'manual',
  'signingCertificate': '-',
  'provisioningProfiles': {}
}
plistlib.dump(p, open('${{ github.workspace }}/${{ env.IPA_OUTPUT }}/exportOptions.plist', 'wb'))
"

          xcodebuild -exportArchive \
            -archivePath "${{ github.workspace }}/${{ env.ARCHIVE_PATH }}" \
            -exportPath "${{ github.workspace }}/${{ env.IPA_OUTPUT }}" \
            -exportOptionsPlist "${{ github.workspace }}/${{ env.IPA_OUTPUT }}/exportOptions.plist" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Gamio-iOS-${{ github.sha }}
          path: ${{ env.IPA_OUTPUT }}/*.ipa
          compression-level: 0
          if-no-files-found: error

      - name: Deactivate Unity License
        if: always()
        uses: game-ci/unity-deactivate@v1
